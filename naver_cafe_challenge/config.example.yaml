# ─────────────────────────────────────────────
#  네이버카페 챌린지 자동업로드 설정 파일
#  이 파일을 config.yaml 로 복사한 뒤 값을 바꾸세요.
# ─────────────────────────────────────────────

cafe:
  # 카페 주소의 마지막 부분 (예: https://cafe.naver.com/mycafe → mycafe)
  url_name: "mycafe"
  # 카페 숫자 ID. 비워두면 url_name 으로 자동으로 찾습니다.
  club_id: ""
  # 글을 올릴 게시판(메뉴) 번호.
  # 게시판을 클릭했을 때 주소에 나오는 menuid=숫자 (또는 /menus/숫자)
  menu_id: 1

challenge:
  name: "30일 아침 운동 챌린지"
  start_date: "2026-12-01"   # 1일차 날짜 (YYYY-MM-DD)
  total_days: 30             # 총 일수. 넘으면 자동으로 올리지 않음
  skip_weekdays: []          # 건너뛸 요일 (0=월 ... 6=일). 예: [5, 6] 주말 제외
  # 건너뛴 날을 회차에서 빼고 셀지 여부 (true면 주말 제외 시 평일만 1,2,3...)
  count_only_posting_days: false

post:
  # draft   = 임시등록만 (직접 확인 후 발행 버튼은 내가 누름) ← 기본, 안전
  # publish = 바로 발행
  mode: "draft"

  # 사용 가능한 치환어:
  #   {challenge} 챌린지 이름   {day} 회차   {total} 총 일수
  #   {date} 2026-12-01   {date_kr} 12월 1일   {weekday} 월요일
  #   {ai_text} AI가 쓴 문장 (ai.enabled 가 false면 ai.fallback_text 로 대체)
  title_template: "[{challenge}] {day}일차 인증 ({date_kr})"
  body_template: |
    ✅ {challenge} {day}/{total}일차

    📅 {date_kr} {weekday}

    {ai_text}

    오늘도 인증 완료! 💪

ai:
  enabled: true
  # ANTHROPIC_API_KEY 환경변수가 필요합니다.
  model: "claude-opus-5-5"
  tone: "밝고 짧게, 2~3문장, 이모지 1~2개"
  # AI에게 추가로 알려줄 내용 (챌린지 설명 등)
  extra_instructions: "아침 30분 운동을 매일 인증하는 카페 챌린지입니다."
  fallback_text: "오늘도 꾸준히 한 걸음 나아갑니다."

photos:
  enabled: true
  folder: "photos"          # 사진을 넣어둘 폴더
  max_per_post: 1
  # 사진 고르는 규칙:
  #   1) 파일명이 회차 번호로 시작하면 우선 사용 (예: 12.jpg, 12_운동.png)
  #   2) 없으면 폴더에서 가장 오래된 사진
  # 올린 사진은 photos/used/ 로 옮겨져 중복 업로드되지 않습니다.
  required: false           # true 면 사진이 없을 때 업로드를 멈춤

browser:
  headless: false           # true 면 창 없이 실행 (네이버가 막을 가능성이 조금 더 높음)
  profile_dir: "browser_profile"  # 로그인 정보가 저장되는 폴더 (공유 금지!)
  # PC에 설치된 크롬을 쓰려면 "chrome" (권장, 자동화 감지가 덜함). 비우면 Playwright 내장 크로미움
  channel: "chrome"
  typing_delay_ms: 40       # 글자 입력 간격 (사람처럼 보이도록)

schedule:
  # 예약 실행 시 매번 같은 시각에 올라가지 않도록 0~N분 사이 랜덤 대기
  random_delay_minutes: 10
