name: Build capture.exe

on:
  push:
    paths:
      - "capture/**"
      - ".github/workflows/build-capture.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow pyinstaller

      - name: Build exe
        working-directory: capture
        run: pyinstaller --onefile --noconsole --name capture capture.py

      - name: Smoke test (exe가 켜지고 살아있는지)
        shell: pwsh
        run: |
          $p = Start-Process capture/dist/capture.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Write-Error "capture.exe exited early (code $($p.ExitCode))"; exit 1 }
          $w = (Get-Process -Id $p.Id).MainWindowTitle
          Write-Host "running, window title: '$w'"
          Stop-Process -Id $p.Id -Force
          Get-Process capture -ErrorAction SilentlyContinue | Stop-Process -Force

      - uses: actions/upload-artifact@v5
        with:
          name: capture-exe
          path: capture/dist/capture.exe
          retention-days: 90

      - name: Publish to release (로그인 없이 받는 고정 링크)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view capture-latest *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload capture-latest capture/dist/capture.exe --clobber
          } else {
            gh release create capture-latest capture/dist/capture.exe --target "${{ github.sha }}" --title "캡처 프로그램 (최신)" --notes "capture.exe 를 받아서 더블클릭하면 실행됩니다."
          }
