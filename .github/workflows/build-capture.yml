name: Build capture.exe

on:
  push:
    paths:
      - "capture/**"
      - ".github/workflows/build-capture.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pillow pyinstaller

      - name: Build exe
        working-directory: capture
        run: pyinstaller --onefile --noconsole --name capture capture.py

      - uses: actions/upload-artifact@v4
        with:
          name: capture-exe
          path: capture/dist/capture.exe
          retention-days: 90
