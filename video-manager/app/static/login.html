<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>영상 관리 — 들어가기</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff4d6d'/%3E%3Cstop offset='1' stop-color='%23ff8a3d'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Crect x='7' y='10' width='18' height='12' rx='3' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M14 13.5v5l4-2.5z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
<form class="login-card" method="post" action="/login">
  <h1>영상 관리</h1>
  <p class="sub">황금주파수 TV · 불심명언</p>
  <label for="pw">비밀번호</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
  <p class="err" id="err" hidden></p>
  <button class="btn primary" type="submit">들어가기</button>
</form>
<script>
  var e = new URLSearchParams(location.search).get("e");
  if (e) {
    var el = document.getElementById("err");
    el.hidden = false;
    el.textContent = e === "many" ? "너무 여러 번 틀렸습니다. 10분 뒤에 다시 해 주세요." : "비밀번호가 맞지 않습니다.";
  }
</script>
</body>
</html>
