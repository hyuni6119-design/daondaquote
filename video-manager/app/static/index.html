<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>영상 관리</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff4d6d'/%3E%3Cstop offset='1' stop-color='%23ff8a3d'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Crect x='7' y='10' width='18' height='12' rx='3' fill='none' stroke='white' stroke-width='2'/%3E%3Cpath d='M14 13.5v5l4-2.5z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="shell">
<aside class="sidebar" id="sidebar">
  <div class="side-brand">
    <div class="brand-logo"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="13" rx="3" stroke="#fff" stroke-width="2"/><path d="M10 9.5v4l3.5-2z" fill="#fff"/></svg></div>
    <span>영상 관리</span>
  </div>
  <nav class="side-nav side-tools" id="toolNav">
    <button type="button" class="nav-item" data-page="refs">🔍 <span>채널 분석</span></button>
  </nav>
  <div class="sidebar-channels">
    <div class="section-label">MY CHANNELS <button type="button" id="addChannel" class="side-add" title="채널 추가" aria-label="채널 추가">＋</button></div>
    <div id="channelNav"></div>
    <nav class="side-nav" id="sideNav">
      <button type="button" class="nav-item" data-page="make">🎬 <span>새 영상 만들기</span></button>
      <button type="button" class="nav-item active" data-page="list">📋 <span>영상 목록</span></button>
      <button type="button" class="nav-item" data-page="chset">⚙ <span>채널 설정</span></button>
    </nav>
  </div>
  <nav class="side-nav side-small" id="bottomNav">
    <button type="button" class="nav-item" data-page="log">🕘 <span>실행 기록</span></button>
    <button type="button" class="nav-item" data-page="settings">🔧 <span>설정·상태</span></button>
  </nav>
  <div class="sidebar-bottom">
    <a class="side-link" href="https://168-119-152-95.sslip.io/" target="_blank" rel="noopener">📡 라이브 관리자 열기</a>
    <a class="side-link" href="/logout">나가기</a>
  </div>
</aside>
<div class="wrap">
  <header class="top">
    <button type="button" class="menu-toggle" id="menuToggle" aria-label="메뉴">☰</button>
    <div>
      <span class="eyebrow">VIDEO MANAGER</span>
      <h1 id="pageTitle">전체 채널</h1>
      <p class="sub" id="pageSub">편마다 썸네일, 제목, 진행상황을 한눈에 봅니다</p>
    </div>
  </header>

  <div class="page" id="page-list">
  <!-- PC의 Claude가 지금 무엇을 하는지 -->
  <section class="now" id="now">
    <div class="now-head">
      <span class="dot"></span>
      <b id="nowState">PC 소식 기다리는 중</b>
      <span class="muted small" id="nowAt"></span>
    </div>
    <div class="now-doing" id="nowDoing" hidden></div>
    <div class="now-grid">
      <div><div class="label">마지막으로 한 일</div><div id="nowLast">—</div></div>
      <div><div class="label">다음에 할 일</div><div id="nowNext">—</div></div>
    </div>
    <div class="row gap">
      <button class="btn primary" id="btnGo">이어서 진행</button>
      <button class="btn" id="btnStop">잠깐 멈춤</button>
      <span class="muted small" id="nowMsg"></span>
    </div>
  </section>

  <section class="queue" id="queue" hidden></section>

  <section class="rvq" id="reviewBox" hidden></section>

  <section class="ups" id="upBox" hidden></section>

  <!-- 고르기 -->
  <div class="toolbar">
    <div class="tabs" id="stTabs"></div>
    <div class="spacer"></div>
    <div class="tabs" id="viewTabs">
      <button data-v="list" class="on">목록</button>
      <button data-v="cards">카드</button>
      <button data-v="cal">달력</button>
    </div>
    <button class="btn primary" id="btnUp">⬆ 영상 올리기</button>
    <button class="btn" id="btnAdd">＋ 새 편</button>
  </div>

  <div class="summary" id="summary"></div>

  <!-- 유튜브 스튜디오 ‘채널 콘텐츠’ 같은 목록 -->
  <main id="list" class="yt-list">
    <div class="yt-row yt-headrow">
      <div class="c-video">동영상</div>
      <div class="c-prog">진행</div>
      <div class="c-priv">공개 상태</div>
      <div class="c-date"><button type="button" class="sortbtn" id="sortDate">날짜 <span id="sortArrow">↓</span></button></div>
      <div class="c-num">조회수</div>
      <div class="c-num">좋아요</div>
    </div>
    <div id="listBody"></div>
  </main>
  <main id="cards" class="cards" hidden></main>
  <main id="cal" class="cal" hidden>
    <div class="cal-head">
      <button class="btn small" id="prevM" aria-label="지난달">‹</button>
      <b id="monthName"></b>
      <button class="btn small" id="nextM" aria-label="다음달">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </main>

  <!-- 지나온 일 (닫혀 있음 · 눌러서 열기) -->
  <details class="card-box shop-wrap" id="shopWrap">
    <summary><b>🛍 쇼핑 태그 확인</b> <span class="muted small" id="shopCount"></span></summary>
    <div id="shopBox"></div>
  </details>
  <details class="log" id="logBox">
    <summary><b>지나온 일</b> <span class="muted small" id="logCount"></span>
      <span class="spacer"></span><button class="btn small" id="btnStats" hidden>조회수 새로고침</button></summary>
    <ol id="logList"></ol>
  </details>
  </div>
  <!-- 다른 메뉴 화면 (app.js 가 채움) -->
  <div class="page" id="page-upload" hidden></div>
  <div class="page" id="page-rules" hidden></div>
  <div class="page" id="page-titles" hidden></div>
  <div class="page" id="page-prompts" hidden></div>
  <div class="page" id="page-refs" hidden></div>
  <div class="page" id="page-make" hidden></div>
  <div class="page" id="page-chset" hidden></div>
  <div class="page" id="page-lyrics" hidden></div>
  <div class="page" id="page-thumbs" hidden></div>
  <div class="page" id="page-shop" hidden></div>
  <div class="page" id="page-log" hidden></div>
  <div class="page" id="page-settings" hidden></div>
</div>
</div>

<!-- 편 자세히 보기 -->
<dialog id="detail" class="studio">
  <div id="detailBody"></div>
</dialog>

<!-- 채널 넣기 · 고치기 -->
<dialog id="chDlg">
  <form id="chForm" class="stack">
    <h3 id="chDlgTitle">채널 넣기</h3>
    <label>채널 이름 <input name="name" required maxlength="40" placeholder="라이브 관리자의 채널 이름과 똑같이"></label>
    <label>보이는 이름 (선택) <input name="display" maxlength="60" placeholder="예: 황금주파수 TV"></label>
    <label class="row gap">색 <input type="color" name="color" value="#7c5cff"></label>
    <p class="muted small">이름이 라이브 관리자의 채널 이름과 같아야 조회수·썸네일 채우기와 사이트에서 올리기가 그 채널로 됩니다.</p>
    <div class="row gap">
      <button class="btn primary" type="submit">저장</button>
      <button class="btn" type="button" id="chCancel">닫기</button>
    </div>
  </form>
</dialog>

<!-- 새 편 -->
<dialog id="addDlg">
  <form id="addForm" class="stack">
    <h3>새 편을 넣습니다</h3>
    <label>어느 채널 <select name="channel" id="addCh"></select></label>
    <label>공개할 날 <input type="date" name="date" required></label>
    <label class="check"><input type="checkbox" name="start" checked> 넣자마자 PC에게 "이 편 만들어" 시키기</label>
    <p class="muted small">편 번호는 알아서 다음 번호로 붙입니다.</p>
    <div class="row gap">
      <button class="btn primary" type="submit">넣기</button>
      <button class="btn" type="button" id="addCancel">닫기</button>
    </div>
  </form>
</dialog>

<!-- 영상 올리기 -->
<dialog id="upDlg" class="updlg">
  <div id="upBody"></div>
</dialog>

<div class="toast" id="toast" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
