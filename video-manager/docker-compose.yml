# 라이브 사이트와 완전히 따로 도는 영상 관리 사이트입니다.
# 같은 서버에 있어도 프로그램·데이터·주소가 모두 분리되어 있습니다.
services:
  video-manager:
    build: .
    container_name: video-manager
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8090:8080"   # 서버 안에서만 열고, 바깥 주소는 리버스 프록시가 연결합니다
