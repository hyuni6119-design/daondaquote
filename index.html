<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>렌터카 장애처리 업무사이트</title>
<style>
:root{
  --bg:#f4f7fb;--panel:#fff;--text:#18212f;--muted:#6c7787;--line:#dfe5ec;
  --primary:#1565c0;--primary2:#0d47a1;--soft:#eaf3ff;--ok:#16835a;--warn:#b66a00;--danger:#c23a3a;
  --shadow:0 10px 30px rgba(20,42,74,.08);--radius:18px;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}
.sidebar{background:#10233f;color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-weight:800;font-size:20px;padding:8px 10px 22px}
.brand small{display:block;font-size:11px;font-weight:500;color:#9fb1c8;margin-top:4px}
.nav button{width:100%;border:0;background:transparent;color:#cbd6e5;text-align:left;padding:12px 13px;border-radius:11px;margin:3px 0}
.nav button:hover,.nav button.active{background:#1b3b66;color:#fff}
.side-note{margin:18px 0 4px;background:#173052;border:1px solid #29466a;padding:12px;border-radius:12px;font-size:11px;color:#bfcadd;line-height:1.55}
.main{min-width:0}
.topbar{height:74px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 28px;position:sticky;top:0;z-index:10}
.top-title{font-weight:800;font-size:19px;padding-left:14px;display:flex;align-items:center;gap:8px;min-width:0;flex:1 1 auto;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.top-title .btn{white-space:nowrap}
.topbar-right{flex:0 0 auto}
.manager{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--muted)}
.manager input{width:170px}
.content{padding:26px;max-width:1480px;margin:auto}
.view{display:none}.view.active{display:block}
.grid{display:grid;gap:18px}.grid.cols-3{grid-template-columns:repeat(3,1fr)}.grid.cols-2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card h2,.card h3{margin:0 0 14px}.card h2{font-size:20px}.card h3{font-size:16px}
.kpi{padding:20px}.kpi .label{color:var(--muted);font-size:13px}.kpi .value{font-size:30px;font-weight:800;margin-top:8px}
.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}
.badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:#eef3f8;font-size:11px;font-weight:700}
.badge.blue{background:#e5f0ff;color:#1259a8}.badge.green{background:#e5f7ef;color:#126b4b}.badge.orange{background:#fff3dd;color:#9a5a00}
.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:#536070}
input,select,textarea{width:100%;border:1px solid #cfd8e3;border-radius:10px;padding:10px 11px;background:#fff;color:var(--text);outline:none}
input:focus,select:focus,textarea:focus{border-color:#69a7e9;box-shadow:0 0 0 3px #eaf3ff}
textarea{min-height:88px;resize:vertical}
.field.span2{grid-column:span 2}.field.span3{grid-column:span 3}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.btn{border:1px solid #cfd8e3;background:#fff;border-radius:10px;padding:10px 14px;font-weight:700}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary2)}
.btn.soft{background:var(--soft);border-color:#cfe4ff;color:#155aa8}
.btn.success{background:#157a56;border-color:#157a56;color:#fff}
.btn.danger{background:#fff4f4;border-color:#f0c2c2;color:#b52d2d}
.btn:disabled{opacity:.45;cursor:not-allowed}
.notice{padding:13px 15px;border-radius:12px;background:#f7f9fc;border:1px solid var(--line);font-size:13px;line-height:1.55}
.notice.blue{background:#edf5ff;border-color:#cfe4ff}.notice.warn{background:#fff8eb;border-color:#f3dba8}.notice.ok{background:#edf9f4;border-color:#c6eadb}
.progress{display:flex;gap:5px;margin:6px 0 20px;overflow:auto}
.progress span{white-space:nowrap;padding:8px 10px;border-radius:9px;background:#eef2f6;color:#7b8795;font-size:11px;font-weight:700}
.progress span.done{background:#e6f6ef;color:#167451}.progress span.current{background:#e5f0ff;color:#1259a8}
.script{background:#0f1e31;color:#eef5ff;border-radius:14px;padding:15px;white-space:pre-wrap;line-height:1.65;font-family:inherit;font-size:13px}
.step-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:18px}
.stepbox{border-left:4px solid #dce7f3;padding-left:16px;margin:16px 0}.stepbox.current{border-left-color:var(--primary)}
.stepbox h3{margin-bottom:8px}.rightbox{position:sticky;top:96px;align-self:start}
.case-line{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px dashed #e4e9ef;font-size:13px}
.case-line:last-child{border:0}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{border-bottom:1px solid #e6ebf1;padding:9px 8px;text-align:left;vertical-align:top}
th{background:#f7f9fc;color:#526071;position:sticky;top:0}
.table-wrap{overflow:auto;max-height:590px;border:1px solid var(--line);border-radius:12px}
.toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.toolbar .search{max-width:360px}
.center-tabs{display:flex;gap:8px;flex-wrap:wrap}.center-tabs button{padding:9px 13px;border:1px solid #ccd6e1;background:#fff;border-radius:9px}.center-tabs button.active{background:#173e6d;color:#fff;border-color:#173e6d}
.empty{padding:32px;text-align:center;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(12,24,40,.42);display:none;align-items:center;justify-content:center;z-index:100}.modal.open{display:flex}
.modalbox{background:#fff;border-radius:18px;width:min(900px,92vw);max-height:88vh;overflow:auto;padding:22px;box-shadow:0 25px 70px rgba(0,0,0,.2)}
.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.pricehint{margin-top:8px;padding:10px;border-radius:10px;background:#f6f9fd;font-size:12px}

.quick-photo{margin:12px 0 4px;padding:14px 16px;border:2px dashed #77aef5;border-radius:13px;background:#eef6ff;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.quick-photo .photo-title{font-weight:800;color:#164b8f;min-width:150px}.quick-photo input[type=file]{max-width:520px;background:#fff}.quick-photo .photo-status{font-size:12px;color:#526477;font-weight:700}
.cost-auto-box{margin-top:10px;padding:11px 13px;border-radius:11px;background:#f8fbff;border:1px solid #cfe0f4;font-size:12px;line-height:1.6}.cost-auto-box b{color:#164b8f}
.master-match{margin-top:14px}.master-match .table-wrap{max-height:300px}.master-match table{min-width:1150px}.master-match th{white-space:nowrap}.master-match td{font-size:12px}
.master-full .table-wrap{max-height:650px}.master-full table{min-width:2200px}.master-full th{white-space:nowrap;text-align:center}.master-full td{font-size:12px;vertical-align:top}.master-full .src-row{color:#6b7a8d;font-size:11px}.master-full .moneycell{text-align:right;white-space:nowrap}.master-full .memo-cell{min-width:240px;white-space:pre-wrap}
.incoming-wrap{border:2px solid #b9d8ff;background:linear-gradient(180deg,#f7fbff,#fff);border-radius:16px;padding:18px;margin-top:16px}
.incoming-wrap textarea{min-height:210px;font-size:14px;line-height:1.65;background:#fff}
.parse-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.parse-head h3{margin:0}.parse-result{margin-top:12px}.parse-chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.parse-chip{display:inline-flex;gap:5px;align-items:center;background:#eef5ff;color:#174f8d;border:1px solid #d5e7fb;border-radius:999px;padding:6px 9px;font-size:11px;font-weight:700}
.parse-chip.missing{background:#fff3f3;color:#ae3232;border-color:#f1cccc}
.auto-field{background:#fbfdff}.source-address{background:#f6f8fb;color:#526071}
.aff-tabs{display:flex;gap:8px;margin-bottom:14px}.aff-tabs button{padding:9px 18px;border:1px solid #ccd6e1;background:#fff;border-radius:9px;font-weight:700;color:#526071}.aff-tabs button.active{background:#173e6d;color:#fff;border-color:#173e6d}
.aff-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.aff-links{display:flex;gap:16px;flex-wrap:wrap;white-space:nowrap}.aff-links a{color:#1a63c9;font-weight:700;font-size:12.5px;text-decoration:underline;cursor:pointer}.aff-links a:hover{color:#0d3f82}
.aff-table-wrap table{min-width:920px}.aff-table th{background:#173e6d;color:#fff;white-space:nowrap;text-align:left}.aff-table td{padding:4px 6px;vertical-align:middle}
.aff-table td input{width:100%;border:1px solid transparent;background:transparent;padding:8px 7px;border-radius:7px;font-size:13px;color:#17283b}
.aff-table td input:hover{border-color:#dfe6ee}.aff-table td input:focus{border-color:#2b6cb0;background:#fff}
.aff-table tr:nth-child(even) td{background:#f9fbfd}
.aff-table td.aff-del{text-align:center}.aff-table a.danger-link{color:#c23a3a;font-weight:700;font-size:12.5px;text-decoration:underline;cursor:pointer;white-space:nowrap}
.aff-paste{margin-top:16px}.aff-paste summary{cursor:pointer;color:#1a63c9;font-weight:700;font-size:12.5px}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
@media(max-width:1000px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.side-note{display:none}.step-layout{grid-template-columns:1fr}.rightbox{position:static}.grid.cols-3,.grid.cols-2,.form-grid{grid-template-columns:1fr}.field.span2,.field.span3{grid-column:span 1}}

/* V3 workflow usability */
.workflow-sticky{position:sticky;top:74px;z-index:9;background:rgba(244,247,251,.96);backdrop-filter:blur(8px);padding:10px 0 12px;margin:-8px 0 14px;border-bottom:1px solid #e4e9f0}
.workflow-sticky .progress{display:flex;gap:6px;margin:0;overflow:auto;padding:2px 1px}
.workflow-sticky .progress span{white-space:nowrap;padding:9px 11px;border-radius:9px;background:#eef2f6;color:#7b8795;font-size:11px;font-weight:700;border:1px solid transparent}
.workflow-sticky .progress span.done{background:#e6f6ef;color:#167451;border-color:#cbe9dc}
.workflow-sticky .progress span.current{background:#e5f0ff;color:#1259a8;border-color:#bcd8f7;box-shadow:0 3px 10px rgba(21,101,192,.12)}
.progress button{white-space:nowrap;padding:8px 10px;border-radius:9px;background:#eef2f6;color:#7b8795;font-size:11px;font-weight:700;border:1px solid transparent;cursor:pointer;font-family:inherit;transition:.15s transform,.15s box-shadow,.15s background}
.progress button:hover{transform:translateY(-1px);box-shadow:0 3px 10px rgba(16,35,63,.12);background:#e8eef5;color:#334155}
.progress button.done{background:#e6f6ef;color:#167451;border-color:#cbe9dc}
.progress button.current{background:#e5f0ff;color:#1259a8;border-color:#bcd8f7;box-shadow:0 3px 10px rgba(21,101,192,.12)}
.workflow-sticky .progress button{padding:9px 11px}

.flow-jump-flash{outline:3px solid rgba(37,99,235,.28);box-shadow:0 0 0 7px rgba(37,99,235,.08)!important;transition:.2s}

.step-layout{grid-template-columns:minmax(0,1fr) 360px}
.workflow-stack{display:grid;gap:14px}
.workflow-stack .stepbox{background:#fff;border:1px solid #dfe5ec;border-left:5px solid #dce7f3;border-radius:16px;padding:18px;margin:0;box-shadow:0 6px 18px rgba(20,42,74,.05)}
.workflow-stack .stepbox.current{border-left-color:var(--primary);border-top-color:#bcd8f7;border-right-color:#bcd8f7;border-bottom-color:#bcd8f7;box-shadow:0 8px 24px rgba(21,101,192,.10)}
.workflow-stack .stepbox h3{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.rightbox{top:210px;max-height:calc(100vh - 226px);overflow:auto}

.center-context-banner{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:8px 0 0;padding:10px 16px;border:2px solid #bfd6f4;border-radius:12px;background:#f4f9ff;box-shadow:0 4px 14px rgba(34,91,158,.08)}
.center-context-banner .cc-left{display:flex;align-items:center;gap:14px;min-width:0}
.center-context-banner .cc-label{font-size:12px;font-weight:800;color:#56718f;white-space:nowrap}
.center-context-banner .cc-center{font-size:20px;font-weight:950;letter-spacing:-.5px;color:#102f55;white-space:nowrap}
.center-context-banner .cc-arrow{font-size:20px;color:#8aa9c9;font-weight:900}
.center-context-banner .cc-shop{font-size:17px;font-weight:900;color:#174d84;white-space:nowrap}
.center-context-banner .cc-right{display:flex;align-items:baseline;gap:10px;color:#56718f;text-align:right}.center-context-banner .cc-right b{font-size:20px;color:#12385f}.center-context-banner .cc-right span{font-size:14px;font-weight:800}
.center-context-banner.ilsan{border-color:#afd0fb;background:#f1f7ff}
.center-context-banner.icheon{border-color:#b9dfc9;background:#f3fbf6}
.center-context-banner.daegu{border-color:#f2cf9f;background:#fff8ee}
@media(max-width:900px){.center-context-banner{align-items:flex-start;flex-direction:column}.center-context-banner .cc-left{flex-wrap:wrap}.center-context-banner .cc-center{font-size:18px}.center-context-banner .cc-right{text-align:left}}

.assign-cost-box{margin-top:16px;padding:18px 20px;border:3px solid #f59e0b;border-radius:16px;background:linear-gradient(135deg,#fff8df,#fffdf5);box-shadow:0 8px 22px rgba(217,119,6,.18)}
.assign-cost-box label{display:block;font-size:18px;font-weight:950;color:#92400e;margin-bottom:8px}
.assign-cost-box input{font-size:24px!important;font-weight:950!important;color:#7c2d12!important;border:2px solid #f59e0b!important;background:#fff!important;padding:13px 15px!important}
.assign-cost-box .assign-help{font-size:13px;font-weight:700;color:#8a4b13;margin-top:9px;line-height:1.55}
.compact-core{background:#f6f9fd;border:1px solid #d9e3ef;border-radius:12px;padding:4px 12px;margin-bottom:10px}
.info-toggle{border:1px solid #d9e3ef;border-radius:12px;background:#fff;margin-top:10px;overflow:hidden}
.info-toggle summary{cursor:pointer;list-style:none;padding:12px 14px;font-size:13px;font-weight:900;color:#174d84;background:#f5f9fe;display:flex;justify-content:space-between;align-items:center}
.info-toggle summary::-webkit-details-marker{display:none}.info-toggle summary:after{content:'열기';font-size:11px;color:#60748a}.info-toggle[open] summary:after{content:'닫기'}
.info-toggle-body{padding:4px 14px 12px}.info-toggle .raw-kakao-section{margin-top:0}.info-toggle .raw-kakao-card{border:0;border-radius:0}

.vehicle-hero{background:linear-gradient(135deg,#10233f,#1c4b7e);color:#fff;border-radius:14px;padding:16px;margin-bottom:14px}
.vehicle-hero .vehicle-no{font-size:24px;font-weight:900;letter-spacing:.2px}
.vehicle-hero .vehicle-model{font-size:14px;color:#d7e5f5;margin-top:4px}
.vehicle-hero .center-name{font-size:15px;font-weight:900;color:#d9ebff;margin-top:10px;line-height:1.35}
.reply-input{min-height:145px;font-size:14px;line-height:1.65;background:#fffefb;border-color:#e6d6b8}
.reply-analysis{margin-top:12px;border:1px solid #cfe4ff;background:#f3f8ff;border-radius:12px;padding:12px}
@media(max-width:1000px){.workflow-sticky{top:0}.rightbox{top:auto;max-height:none;overflow:visible}}


/* V4 alert-talk compact UI */
.alerttalk-box{width:54%;min-width:520px;max-width:720px;justify-self:start}
.alert-meta-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.alert-meta-card{border:1px solid #cfdceb;background:#f8fbff;border-radius:12px;padding:12px}
.alert-meta-card .meta-label{font-size:11px;font-weight:800;color:#5f6e80;margin-bottom:7px}
.alert-meta-card .meta-value{font-size:12px;font-weight:800;line-height:1.45;word-break:keep-all}
.alert-meta-card .btn{margin-top:9px;padding:7px 10px;font-size:11px}
.copy-edit{width:100%;min-width:0;border:1px solid #d9e0e8;border-radius:8px;padding:8px 10px;background:#fff;font:inherit;color:#182033}.copy-edit:focus{outline:none;border-color:#4b7bec;box-shadow:0 0 0 2px rgba(75,123,236,.10)}
.alert-content-panel{border:1px solid #dfe5ec;border-radius:12px;overflow:hidden;background:#fff}
.alert-content-title{padding:10px 12px;background:#f4f7fb;border-bottom:1px solid #dfe5ec;font-size:12px;font-weight:900;color:#45556a}
.copy-row{display:grid;grid-template-columns:82px minmax(0,1fr) 62px;gap:9px;align-items:center;padding:8px 10px;border-bottom:1px solid #edf1f5;font-size:12px}
.copy-row:last-child{border-bottom:0}
.copy-row .copy-label{font-weight:700;color:#5b697a}
.copy-row .copy-value{font-weight:800;word-break:break-all}
.copy-row .btn{padding:6px 8px;font-size:11px}
.alert-checklist{margin-top:12px;border-radius:12px;padding:11px 12px;border:1px solid #dfe5ec;background:#f8fafc}
.alert-checklist.ok{background:#eefaf5;border-color:#c6eadb}
.alert-checklist.warn{background:#fff8eb;border-color:#f0d49b}
.alert-checklist-title{font-size:12px;font-weight:900;margin-bottom:7px}
.alert-check-item{font-size:11px;line-height:1.7}
.folder-edit{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;align-items:end;margin-top:10px}
.folder-edit .field{margin:0}
@media(max-width:1150px){.alerttalk-box{width:70%;min-width:0}}
@media(max-width:1000px){.alerttalk-box{width:100%;max-width:none}.alert-meta-grid{grid-template-columns:1fr}.copy-row{grid-template-columns:72px minmax(0,1fr) 58px}}

/* V5 shop + status workspace */
.shop-contact-card{border:1px solid #cfe0f3;background:#f5f9ff;border-radius:12px;padding:12px 13px;margin:12px 0}
.shop-contact-card .shop-title{font-size:12px;font-weight:900;color:#244c79;margin-bottom:8px}
.shop-contact-row{display:grid;grid-template-columns:70px minmax(0,1fr) 58px;gap:8px;align-items:center;padding:6px 0;font-size:12px}
.shop-contact-row+.shop-contact-row{border-top:1px dashed #d9e4ef}
.shop-contact-row .key{color:#617083;font-weight:700}.shop-contact-row .val{font-weight:900;word-break:keep-all}
.bucket-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.bucket-tab{border:1px solid #d7e0ea;background:#fff;border-radius:14px;padding:13px 15px}
.bucket-link{width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;transition:.15s ease;box-shadow:0 1px 2px rgba(16,35,63,.03)}
.bucket-link:hover{transform:translateY(-1px);border-color:#9db7da;box-shadow:0 7px 18px rgba(16,35,63,.08);background:#fbfdff}
.bucket-link:focus-visible{outline:3px solid rgba(37,99,235,.22);outline-offset:2px}
.bucket-tab .count{font-size:24px;font-weight:900;margin-top:5px}.bucket-tab .caption{font-size:11px;color:var(--muted)}
.status-pending{background:#fff4dd;color:#945600}.status-done{background:#e5f7ef;color:#126b4b}
.recent-actions{display:flex;gap:6px;flex-wrap:wrap}.recent-actions .btn{padding:6px 9px;font-size:11px}
.completion-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;margin-top:14px}
.completion-side{background:#f8fafc;border:1px solid #e0e6ee;border-radius:14px;padding:14px}
@media(max-width:1000px){.bucket-tabs{grid-template-columns:1fr}.completion-grid{grid-template-columns:1fr}.shop-contact-row{grid-template-columns:64px minmax(0,1fr) 54px}}

/* V6 backup / restore / trash */
.backup-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}
.backup-actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.backup-list{display:grid;gap:9px;margin-top:12px}
.backup-item{border:1px solid #dfe5ec;border-radius:12px;padding:12px;display:flex;justify-content:space-between;gap:12px;align-items:center;background:#fff}
.backup-item .meta{min-width:0}.backup-item .meta b{display:block}.backup-item .meta span{font-size:11px;color:var(--muted)}
.restore-preview{border:1px solid #bfd8f4;background:#f3f8ff;border-radius:13px;padding:14px;margin-top:12px}
.restore-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.restore-stat{background:#fff;border:1px solid #dbe7f3;border-radius:10px;padding:10px;text-align:center}.restore-stat b{display:block;font-size:20px}
.trash-row{opacity:.94}
.file-btn{display:inline-flex;align-items:center;gap:7px}
@media(max-width:1000px){.backup-grid{grid-template-columns:1fr}.restore-stats{grid-template-columns:repeat(2,1fr)}}

  if(!date&&!time)return '시간 확인 부탁드립니다.';
  let label='';

    const d=new Date(date+'T12:00:00');
    const ref=c?.referenceDate||nowISO();

function inferReplacementPosition(raw,workType){

function normalizeLookupPartNo(v){return String(v||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function parsePartLookupPaste(raw){
  raw=String(raw||'').replace(/\r/g,'').trim();
  const clean=s=>String(s||'').replace(/\*\*/g,'').replace(/`/g,'').replace(/^\s*[:|-]+\s*$/,'').trim();
  let name='',partNo='',price=0,carModel='';
  const lines=raw.split('\n').map(x=>x.trim()).filter(Boolean);
  for(const line of lines){
    if(/^\|?\s*:?-{2,}/.test(line))continue;
    let cells=[];
    if(line.includes('|'))cells=line.split('|').map(clean).filter(Boolean);
    else if(line.includes('\t'))cells=line.split('\t').map(clean).filter(Boolean);
    else cells=line.split(/\s{2,}/).map(clean).filter(Boolean);
    if(cells.length>=2){
      const pi=cells.findIndex(x=>/[A-Z0-9]{4,}-[A-Z0-9-]{3,}/i.test(x));
      if(pi>=0){
        const pm=cells[pi].match(/[A-Z0-9]{4,}(?:-[A-Z0-9]{2,})+/i);partNo=pm?pm[0].toUpperCase():cells[pi];
        name=clean(cells[Math.max(0,pi-1)]||'');
        if(pi>=2)carModel=clean(cells[pi-2]||'');
        for(let j=pi+1;j<cells.length;j++){const n=Number(String(cells[j]).replace(/[^0-9]/g,''));if(n){price=n;break;}}
        if(partNo)break;
      }
    }
  }
  if(!partNo){const m=raw.match(/\b[A-Z0-9]{4,}(?:-[A-Z0-9]{2,})+\b/i);if(m)partNo=m[0].toUpperCase();}
  if(!price && partNo){const i=raw.toUpperCase().indexOf(partNo.toUpperCase());const tail=i>=0?raw.slice(i+partNo.length):raw;const m=tail.match(/(?:^|[^0-9])(\d{1,3}(?:,\d{3})+|\d{5,})(?:\s*원)?/);if(m)price=Number(m[1].replace(/,/g,''))||0;}
  if(!name && partNo){
    const i=raw.toUpperCase().indexOf(partNo.toUpperCase());
    let before=(i>=0?raw.slice(0,i):'').replace(/[|*_`]/g,' ').split('\n').pop().trim();
    before=before.replace(/^\s*[-:]+|[-:]+\s*$/g,'').trim();if(before)name=before;
  }
  return {name,partNo,price,carModel};
}

function partLookupRateMatches(c,partNo){
  const target=normalizeLookupPartNo(partNo);if(!target)return [];
  const q=normalizeCarKey(c?.carModel||'');
  const vin=String(c?.vin||'').trim().toLowerCase();
  return state.rates.map(r=>{
    const rn=normalizeLookupPartNo(r.partNo||'');
    const exact=rn===target,contains=rn.includes(target)||target.includes(rn);
    const model=normalizeCarKey(effectiveRateModel(r)||r.carModel||'');
    const modelHit=!!q && (model.includes(q)||q.includes(model));
    const vinHit=!!vin && String(r.refVin||'').trim().toLowerCase()===vin;
    const price=Number(replacementPriceFromRate(c,r))||0;
    const partHit=exact||contains;
    let score=(exact?120:contains?90:0)+(modelHit?60:0)+(vinHit?100:0)+(price?5:0);
    return {r,score,exact,modelHit,vinHit,partHit,price};
  }).filter(x=>x.partHit && (q?x.modelHit:(vin?x.vinHit:true))).sort((a,b)=>b.score-a.score || Number(a.r.excelRow)-Number(b.r.excelRow)).slice(0,12);

function updateCaseNo(id,value,returnView=''){
  const c=getCase(id);if(!c)return false;

  const newNo=parseInt(String(value??'').replace(/[^0-9]/g,''),10);

    toast('NO.는 숫자로 입력해 주세요');
    if(returnView==='completion')renderCompletion();
    return false;
  }
  if(newNo===oldNo)return true;
  const duplicate=state.cases.find(x=>x.id!==id && Number(x.no)===newNo);
  if(duplicate){
    alert(`NO.${newNo}은 이미 ${duplicate.vehicleNo||'다른 차량'} 작업에서 사용 중입니다.`);
    if(returnView==='completion')renderCompletion();
    return false;
  }
  const oldDefault=defaultFolderName(c);
  const customWasAuto=!String(c.customFolderName||'').trim() || String(c.customFolderName||'').trim()===oldDefault;
  c.no=newNo;
  if(customWasAuto)c.customFolderName='';
  c.updatedAt=new Date().toISOString();
  save();
  if(returnView==='completion')renderCompletion();
  else if(returnView==='activecases')renderActive();

  else if(document.querySelector('#completionFolderName'))openCompletion(id);

}

function normalizeCarKey(v){return String(v||'').toLowerCase().replace(/[\s._\-\/()]/g,'')}
function effectiveRateModel(r){return r?.lookupModel||r?.carModel||''}
function priceCandidates(model,vin=''){
  const q=normalizeCarKey(model), v=String(vin||'').trim().toLowerCase();
  if(v){const exactVin=state.rates.filter(r=>String(r.refVin||'').trim().toLowerCase()===v);if(exactVin.length)return exactVin.slice(0,12)}
  if(!q)return [];
  const scored=state.rates.map(r=>{const rk=normalizeCarKey(effectiveRateModel(r));if(!rk)return null;let score=0;if(rk===q)score=100;else if(rk.includes(q)||q.includes(rk))score=70;return score?{r,score}:null}).filter(Boolean);
  scored.sort((a,b)=>b.score-a.score||a.r.excelRow-b.r.excelRow);

}
function parseAssignAmount(v){
  const s=String(v||'').replace(/,/g,''); if(!s)return 0;
  let m=s.match(/([0-9]+(?:\.[0-9]+)?)\s*만/); if(m)return Math.round(Number(m[1])*10000);
  m=s.match(/([0-9]{4,})/); return m?Number(m[1]):0;
}
function rateCheckSelectedPrice(work,r){
  const w=String(work||'');
  if(!r)return 0;
  if(w==='유리복원')return Number(r.repair1)||0;
  if(w.includes('전면+후면')){const a=Number(r.replaceFront)||0,b=Number(r.replaceRear)||0;return a&&b?a+b:(a||b)}
  if(w.includes('측면'))return Number(r.replaceSide2)||Number(r.replaceSide1)||0;
  if(w.includes('후면'))return Number(r.replaceRear)||0;
  return Number(r.replaceFront)||0;
}
function rateCheckTintPrice(work,r){
  const w=String(work||''); if(!r)return 0;
  if(w.includes('전면+후면'))return (Number(r.tintFront)||0)+(Number(r.tintRear||r.retintRear)||0);
  if(w.includes('측면'))return Number(r.tintSide)||50000;
  if(w.includes('후면'))return Number(r.tintRear)||Number(r.retintRear)||90000;
  return Number(r.tintFront)||0;
}
function rateCheckRows(query,work,kind=''){
  const q=String(query||'').trim(); if(!q)return [];
  const nq=normalizeCarKey(q), low=q.toLowerCase();
  const scored=state.rates.map(r=>{
    const vals=[effectiveRateModel(r),r.carModel,r.kind,r.partNo,r.refVehicle,r.refVin,r.refAssign,r.memo].map(v=>String(v||''));
    let score=0;
    if(normalizeCarKey(effectiveRateModel(r))===nq)score=120;
    if(String(r.refVin||'').toLowerCase()===low)score=Math.max(score,150);
    if(String(r.refVehicle||'').toLowerCase()===low)score=Math.max(score,145);
    if(String(r.partNo||'').toLowerCase().includes(low))score=Math.max(score,130);
    if(vals.some(v=>v.toLowerCase().includes(low)))score=Math.max(score,80);
    if(nq && normalizeCarKey(effectiveRateModel(r)).includes(nq))score=Math.max(score,95);
    if(kind && r.kind && r.kind!==kind)score-=20;
    if(work && work!=='유리복원' && !rateCheckSelectedPrice(work,r))score-=35;
    return score>0?{r,score}:null;
  }).filter(Boolean);
  scored.sort((a,b)=>b.score-a.score||(Number(a.r.excelRow)||999)-(Number(b.r.excelRow)||999));
  return scored.map(x=>x.r).slice(0,30);
}
function rateCheckMatchForCase(c,rows){
  if(!c||!rows?.length)return null;
  if(c.rateSourceId){const exact=rows.find(r=>r.id===c.rateSourceId)||state.rates.find(r=>r.id===c.rateSourceId);if(exact)return exact}

  return rows.find(r=>rateCheckSelectedPrice(c.workType,r))||rows[0];
}

function inferVehicleClass(model,vin=''){
  const candidates=priceCandidates(model,vin);
  const repairNums=candidates.map(r=>Number(r.repair1)||0).filter(Boolean);
  if(repairNums.some(v=>v>=70000))return '수입';
  if(repairNums.some(v=>v>0&&v<70000))return '국산';
  const t=normalizeCarKey(model);
  const importWords=['bmw','벤츠','benz','mercedes','아우디','audi','폭스바겐','volkswagen','테슬라','tesla','model3','modely','모델3','모델y','볼보','volvo','렉서스','lexus','토요타','toyota','미니','mini','포르쉐','porsche','랜드로버','rangerover','레인지로버','재규어','jaguar','지프','jeep','푸조','peugeot','시트로엥','citroen','폴스타','polestar','캐딜락','cadillac'];
  return importWords.some(x=>t.includes(normalizeCarKey(x)))?'수입':'국산';
}
function intakeReplacementPrice(workType,r){
  const w=String(workType||''); if(!r)return 0;
  if(w.includes('전면+후면')){const a=Number(r.replaceFront)||0,b=Number(r.replaceRear)||0;return a&&b?a+b:(a||b)}
  if(w.includes('측면'))return Number(r.replaceSide2)||Number(r.replaceSide1)||0;
  if(w.includes('후면'))return Number(r.replaceRear)||0;
  return Number(r.replaceFront)||0;
}
function preferredIntakeRate(workType,model,vin,raw=''){
  const rows=priceCandidates(model,vin).filter(r=>intakeReplacementPrice(workType,r)>0);
  if(!rows.length)return null;
  const desired=/정품/.test(raw)?'정품':(/비품/.test(raw)?'비품':'비품');
  return rows.find(r=>r.kind===desired)||rows[0];
}
function intakePricing(workType,model,vin,vehicleClass,raw=''){
  if(workType==='유리복원'){
    const cls=vehicleClass||inferVehicleClass(model,vin);
    return {vehicleClass:cls,repairCost:cls==='수입'?77000:55000,processCost:cls==='수입'?70000:50000,source:cls==='수입'?'수입차 복원 기준':'국산차 복원 기준'};
  }
  if(/교체|교환/.test(String(workType||''))){
    const r=preferredIntakeRate(workType,model,vin,raw); if(!r)return {vehicleClass:vehicleClass||inferVehicleClass(model,vin),repairCost:0,processCost:0,source:'전산입력단가 매칭 필요'};
    const supply=intakeReplacementPrice(workType,r); const vat=Math.round(supply*1.1);
    return {vehicleClass:vehicleClass||inferVehicleClass(model,vin),repairCost:vat,processCost:0,source:`전산입력단가 ${r.excelRow}행 · ${r.kind||'-'} · 공급가 ${money(supply)}`,rate:r,supply};
  }

}

function inferWorkTypeFromMessage(raw){

  const hasVinLike=/\b[A-HJ-NPR-Z0-9]{17}\b/i.test(cleaned);
  if(/후면유리?재부착|후면.*재부착|재부착/.test(t))return '후면유리재부착';
  if(hasReplace && /(전면|앞)/.test(t) && /(후면|뒤)/.test(t))return '전면+후면유리교체';
  if(hasReplace && /전면/.test(t) && /썬팅/.test(t))return '전면유리교체 및 썬팅';
  if(hasReplace && /(측면|조수석|운전석|1열|2열|슬라이드유리)/.test(t))return '측면유리교체';
  if(hasReplace && /(후면|뒤유리|뒷유리)/.test(t))return '후면유리교체';
  if(hasReplace)return '전면유리교체';
  if(/견적/.test(t) && (/(차대번호|VIN|정품|비품|썬팅|유리)/i.test(t)||hasVinLike)){
    if(/(측면|조수석|운전석|1열|2열)/.test(t))return '측면유리교체';
    if(/(후면|뒤유리|뒷유리)/.test(t))return '후면유리교체';
    return /썬팅/.test(t)?'전면유리교체 및 썬팅':'전면유리교체';
  }
  if(/복원/.test(t))return '유리복원';
  return state.workTypes[0]||'유리복원';
}
function parseDepartureFromMessage(raw,special,referenceISO){
  const text=(special||'')+'\n'+cleanIncomingText(raw);
  // '내일 출고차량', '익일 출고차량', '출고 예정', '출발 예정' 등 실제 카톡 표현을 폭넓게 인식
  const related=/(?:출고|출발)\s*(?:예정|예정차량|차량|일정)|(?:출고|출발)차량|완료가능\s*시간|(?:익일|내일).{0,20}(?:출고|출발)|(?:출고|출발).{0,20}(?:익일|내일)|(?:오늘|금일|내일|익일|\d{1,2}\s*월\s*\d{1,2}\s*일|\d{1,2}\s*일).{0,24}(?:까지|완료|처리|조치|작업)/s.test(text);
  let departureYn=related?'있음':'없음', date='',time='';
  const ref=new Date((referenceISO||nowISO())+'T12:00:00');
  const departureContext=(text.match(/.{0,24}(?:출고|출발).{0,24}/s)||[])[0]||text;
  const md=departureContext.match(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/);
  if(md){
    const d=new Date(ref.getFullYear(),Number(md[1])-1,Number(md[2]),12);date=localISODate(d);
  }else if(/익일|내일/.test(departureContext)){
    const d=new Date(ref);d.setDate(d.getDate()+1);date=localISODate(d);
  }else if(/오늘|금일/.test(departureContext)){
    date=localISODate(ref);
  }else{
    const dm=departureContext.match(/\(?\s*(\d{1,2})\s*일\s*\)?/);
    if(dm&&related){
      const day=Number(dm[1]);let y=ref.getFullYear(),m=ref.getMonth();
      if(day<ref.getDate()-20)m+=1; else if(day>ref.getDate()+20)m-=1;
      const d=new Date(y,m,day,12);date=localISODate(d);
    }
  }
  const tm=departureContext.match(/(오전|오후)?\s*(\d{1,2})\s*시(?:\s*(\d{1,2})\s*분)?/);
  if(tm&&related){
    let h=Number(tm[2]),min=Number(tm[3]||0);
    if(tm[1]==='오후'&&h<12)h+=12;if(tm[1]==='오전'&&h===12)h=0;
    if(h>=0&&h<24&&min>=0&&min<60)time=`${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')}`;
  }
  return {departureYn,date,time};
}

}
function normalizeDetailLocation(value){

function extractPlateFromText(raw){
  const cleaned=cleanIncomingText(raw);
  const m=cleaned.match(/\d{2,3}\s?[가-힣]\s?\d{4}/);
  return m?m[0].replace(/\s+/g,''):'';
}
function extractModelFromText(raw){
  const cleaned=cleanIncomingText(raw);
  const labeled=/^(차량번호|차종|주소|차대번호|VIN|특이사항|시공내용|작업내용|파손부위|차량위치|담당자연락처|담당자 연락처|연락처|전화번호)\s*[:：]/i;
  const plateRe=/\d{2,3}\s?[가-힣]\s?\d{4}/;
  const lines0=cleaned.split('\n').map(x=>x.trim()).filter(Boolean);
  // 1) 차량번호(plate) 바로 옆에 붙은 한글 텍스트가 차종인 경우 (예: "223호8506 그랜저", "차량정보 223호8506 그랜저")
  for(const line of lines0){
    if(labeled.test(line))continue;
    const m=line.match(plateRe);
    if(!m)continue;
    const rest=line.replace(m[0],' ').replace(/차량정보|차량번호/g,' ').replace(/[·,:\-|/()]/g,' ').replace(/\s+/g,' ').trim();
    if(rest && !/\d/.test(rest) && /[가-힣a-zA-Z]/.test(rest) && rest.length<=15)return rest;
  }
  const known=[...new Set((state.rates||[]).map(r=>r.carModel).filter(Boolean))].sort((a,b)=>b.length-a.length);
  for(const m of known){ if(m && cleaned.includes(m)) return m; }
  const boilerplate=/(안녕|감사|수고|확인|부탁|드립니다|드리겠습니다|입니다|합니다|처리|작업|시공|출고|출발|입고)/;
  const lines=lines0;
  for(const line of lines){
    if(labeled.test(line))continue;
    if(/\d/.test(line))continue;
    if(!/[가-힣a-zA-Z]/.test(line))continue;
    if(line.length>12)continue;
    if(boilerplate.test(line))continue;
    return line;
  }
  return '';
}
function parseSKKakaoMessage(raw,referenceISO,selectedCenterId){
  raw=cleanIncomingText(raw);

  if(hidden)hidden.value=v;

function intakeDecisionWork(decision,raw,currentWork,suggested){
  if(decision==='repair')return '유리복원';
  if(decision==='pending')return '판단대기';
  if(decision==='keep' && currentWork)return currentWork;
  if(decision==='replace'){
    const s=String(suggested||'');
    if(/교체|교환/.test(s))return s;
    const inferred=inferWorkTypeFromMessage(raw||'');
    if(/교체|교환/.test(inferred))return inferred;
    if(/교체|교환/.test(String(currentWork||'')))return currentWork;
    return '전면유리교체';
  }
  return currentWork||suggested||'유리복원';
}
function initializeReplacementDefaults(c){
  if(!c||!isReplacementCase(c))return;
  if(c.assignmentCost===undefined||c.assignmentCost===null)c.assignmentCost=0;
  c.processCost=Number(c.assignmentCost)||0;
  c.replacementGlassKind=/정품/.test(c.rawMessage||'')&&!/비품/.test(c.rawMessage||'')?'정품':(c.replacementGlassKind||'비품');
  c.replacementPosition=c.replacementPosition||inferReplacementPosition(c.rawMessage||'',c.workType);
  c.replacementTintYn=c.replacementTintYn||(/썬팅/.test(c.rawMessage||'')&&!/썬팅\s*(없이|미진행)|교체만/.test(c.rawMessage||'')?'진행':'미진행');
  ensureReplacementQuoteOptions(c);
  const lookupMatch=c.lookupPartNo?partLookupRateMatches(c,c.lookupPartNo)[0]:null;
  const lookupRate=lookupMatch?.r||null;
  if(c.lookupPartNo)c.replacementPartNo=c.replacementPartNo||c.lookupPartNo;
  if(lookupRate){
    const matchedPrice=Number(replacementPriceFromRate(c,lookupRate))||0;
    c.rateSourceId=lookupRate.id;c.rateSourceExcelRow=lookupRate.excelRow;
    c.replacementGlassKind=c.replacementGlassKind||lookupRate.kind||'비품';
    c.replacementGlassPrice=matchedPrice||c.replacementGlassPrice||0;
    c.replacementPartNo=lookupRate.partNo||c.lookupPartNo||'';
    c.repairCost=matchedPrice?Math.round(matchedPrice*1.1):(c.repairCost||0);
    if(String(lookupRate.kind||'').includes('정품')){c.quoteOemPrice=matchedPrice;c.quoteOemPartNo=lookupRate.partNo||'';}
    if(String(lookupRate.kind||'').includes('비품')){c.quoteAftermarketPrice=matchedPrice;c.quoteAftermarketPartNo=lookupRate.partNo||'';}
  }
  const oem=replacementRateCandidateByKind(c,'정품'),after=replacementRateCandidateByKind(c,'비품');
  if(oem){c.quoteOemPrice=Number(c.quoteOemPrice)||Number(replacementPriceFromRate(c,oem))||0;c.quoteOemPartNo=c.quoteOemPartNo||oem.partNo||'';}
  if(after){c.quoteAftermarketPrice=Number(c.quoteAftermarketPrice)||Number(replacementPriceFromRate(c,after))||0;c.quoteAftermarketPartNo=c.quoteAftermarketPartNo||after.partNo||'';}
  const primary=lookupRate||after||oem;
  if(primary){
    c.rateSourceId=c.rateSourceId||primary.id;c.rateSourceExcelRow=c.rateSourceExcelRow||primary.excelRow;
    c.replacementGlassPrice=Number(c.replacementGlassPrice)||Number(replacementPriceFromRate(c,primary))||0;
    c.repairCost=c.repairCost||(c.replacementGlassPrice?Math.round(c.replacementGlassPrice*1.1):0);
    c.replacementPartNo=c.replacementPartNo||primary.partNo||'';
  }
}

}
function setStage(id,n){let c=getCase(id);if(!c)return;c.stage=Math.max(c.stage,n);save();render('newcase')}
function parseShopReplyMessage(raw,c){
  const text=cleanIncomingText(raw);
  const refISO=(c&&c.referenceDate)||nowISO();
  const ref=new Date(refISO+'T12:00:00');
  let type='',date='',time='',summary='';

  if(/복원(?:은|이|이건|작업)?\s*(불가|어렵|힘들)|교체(?:로|가)?\s*(진행|해야|필요)/.test(text)){
    return {type:'replace',date:'',time:'',summary:'복원 불가 또는 교체 필요 내용으로 판단'};
  }
  if(/처리(?:가|는)?\s*(불가|어렵|힘들)|진행(?:이|은)?\s*(불가|어렵|힘들)|일정(?:이|은)?\s*(불가|어렵|힘들)/.test(text)){
    return {type:'unavailable',date:'',time:'',summary:'시공점 처리 불가/일정 확인 필요로 판단'};
  }

  const hasToday=/오늘|금일/.test(text);
  const hasTomorrow=/내일|익일/.test(text);
  const md=text.match(/(\d{1,2})\s*[월\/.\-]\s*(\d{1,2})\s*일?/);
  const dayOnly=text.match(/(?:^|[^0-9])(\d{1,2})\s*일(?:까지|\s|$)/);
  if(md){
    let y=ref.getFullYear(),m=Number(md[1])-1,d=Number(md[2]);
    let cand=new Date(y,m,d,12);
    if(cand.getTime()<ref.getTime()-1000*60*60*24*180)cand=new Date(y+1,m,d,12);
    date=localISODate(cand);
  }else if(hasTomorrow){
    const d=new Date(ref);d.setDate(d.getDate()+1);date=localISODate(d);
  }else if(hasToday){
    date=localISODate(ref);
  }else if(dayOnly){
    const day=Number(dayOnly[1]);let y=ref.getFullYear(),m=ref.getMonth();
    if(day<ref.getDate()-20)m+=1; else if(day>ref.getDate()+20)m-=1;
    date=localISODate(new Date(y,m,day,12));
  }

  const tm=text.match(/(오전|오후|아침|저녁|밤)?\s*(\d{1,2})\s*시(?:\s*(\d{1,2})\s*분)?/);
  if(tm){
    let h=Number(tm[2]),min=Number(tm[3]||0),period=tm[1]||'';
    if((period==='오후'||period==='저녁'||period==='밤')&&h<12)h+=12;
    if((period==='오전'||period==='아침')&&h===12)h=0;
    if(h>=0&&h<24&&min>=0&&min<60)time=`${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')}`;
  }

  if(hasToday&&!time){type='today';date='';summary='금일 처리로 판단';}
  else if(date||time){
    if(!date)date=localISODate(ref);
    type='datetime';
    summary=`${date}${time?' '+time:''}까지 조치 예정으로 판단`;
  }else if(/할게요|하겠습니다|처리|조치|방문|가능/.test(text)){
    type='today';summary='별도 날짜가 없어 금일 처리로 우선 판단';
  }
  return {type,date,time,summary};
}
function analyzeShopReply(id){
  const c=getCase(id);if(!c)return;

  if(!raw){toast(`${c.shop} 답변 카톡을 붙여넣으세요`);return}
  const p=parseShopReplyMessage(raw,c);
  if(!p.type){toast('일정 정보를 자동으로 찾지 못했습니다. 아래 수동 선택을 이용하세요.');return}

  c.promiseDate=p.date||'';c.promiseTime=p.time||'';c.stage=Math.max(c.stage,3);save();render('newcase');

}

function jumpWorkflowStep(id,step,mode='standard'){
  const c=getCase(id);if(!c)return;
  const n=Number(step)||0;
  if(mode==='replacement'){
    const boxes=[...document.querySelectorAll('#newcase .workflow-stack .stepbox')];
    const target=boxes[n];
    if(target){target.scrollIntoView({behavior:'smooth',block:'start'});target.classList.add('flow-jump-flash');setTimeout(()=>target.classList.remove('flow-jump-flash'),900);}
    return;
  }
  // 일반/SK 복원 플로우: 1번 '접수'는 원 접수내용 수정화면으로, 2~7번은 현재 화면의 단계로 이동합니다.
  if(n===0){editCurrentCase(id);return;}
  if(n>=1&&n<=6){
    const boxes=[...document.querySelectorAll('#newcase .workflow-stack .stepbox')];
    const target=boxes[n-1];
    if(target){target.scrollIntoView({behavior:'smooth',block:'start'});target.classList.add('flow-jump-flash');setTimeout(()=>target.classList.remove('flow-jump-flash'),900);}
    return;
  }
  // 완료사진/완료보고/폴더저장/완료는 업무 상태에 맞는 화면으로 연결합니다.
  if(n>=7&&n<=9){
    if(c.status==='완료대기'){
      show('completion');
      const focus=n===7?'#completionPhotoStep':n===8?'#completionReportStep':'#completionFolderStep';
      setTimeout(()=>openCompletion(id,focus),0);
    }else if(c.status==='완료'){
      show('completedcases');
    }else{
      toast('먼저 7. 작업대기에서 “완료 대기로 이동”을 눌러주세요');
    }
    return;
  }
  if(n===10){
    if(c.status==='완료')show('completedcases');
    else if(c.status==='완료대기'){show('completion');setTimeout(()=>openCompletion(id,'#completionFolderStep'),0);}
    else toast('아직 작업완료 단계가 아닙니다');
  }
}

function updateAffiliateField(id,key,value){const a=(state.affiliates||[]).find(x=>x.id===id);if(!a)return;a[key]=String(value||'').trim();save()}
function parseAffiliatePaste(raw){
  return String(raw||'').replace(/\r/g,'').split('\n').map(l=>l.trim()).filter(Boolean).map(line=>{
    const cells=(line.includes('\t')?line.split('\t'):line.split(/\s{2,}/)).map(c=>c.trim());
    if(cells.length<=3)return {name:cells[0]||'',phone:cells[1]||'',address:cells[2]||''};
    return {name:cells[0]||'',rep:cells[1]||'',phone:cells[2]||'',address:cells[3]||'',region:cells[4]||'',note:cells[5]||''};
  }).filter(r=>r.name);
}
function ingestAffiliatePaste(category){
  const el=$('#affPaste_'+category);
  const rows=parseAffiliatePaste(el?.value||'');
  if(!rows.length){toast('인식된 행이 없습니다. 엑셀에서 복사한 내용을 그대로 붙여넣어 주세요');return}
  createAutoBackup('가맹점·협력점 일괄등록 전');
  state.affiliates=state.affiliates||[];
  rows.forEach(r=>state.affiliates.push({id:'aff'+Date.now()+Math.random().toString(36).slice(2,6),category,...r}));
  save();
  if(el)el.value='';
  renderAffiliates();
  toast(`${category} ${rows.length}건을 등록했습니다`);
}
function deleteAffiliate(id){if(!confirm('이 가맹점 정보를 삭제할까요?'))return;createAutoBackup('가맹점 삭제 전');state.affiliates=(state.affiliates||[]).filter(x=>x.id!==id);save();renderAffiliates()}

function normalizePartKey(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'')}
function isSocarReplacementWork(workType){return /교체/.test(String(workType||''))}
function socarIsTintWork(workType){return /썬팅/.test(String(workType||''))}
function socarStageLabel(n){return ['접수','대표님 보고 완료','시공점 문의 완료','블락 등록 완료','알림톡 발송 완료','작업 진행중','출고요청 완료','복귀확인 · 완료'][Number(n)||0]||'접수'}
function getSocarCase(id){return (state.socarCases||[]).find(x=>x.id===id)}

function parseLabeledBlock(raw,labels){
  const text=String(raw||'').replace(/\r/g,'');
  const positions=labels.map(()=>null);
  let searchFrom=0;
  labels.forEach((lab,i)=>{
    const idx=text.indexOf(lab,searchFrom);
    if(idx===-1)return;
    positions[i]=idx;
    searchFrom=idx+lab.length;
  });
  const result={};
  labels.forEach((lab,i)=>{
    if(positions[i]==null){result[lab]='';return}
    const valStart=positions[i]+lab.length;
    let valEnd=text.length;
    for(let j=i+1;j<labels.length;j++){if(positions[j]!=null){valEnd=positions[j];break}}
    result[lab]=text.slice(valStart,valEnd).trim();
  });
  return result;
}

const SOCAR_CASE_COLUMNS=['no','statusRaw','endTime','faultType','faultCat1','faultCat2','receivedAt','completedAt','vehicleRaw','region','socarZoneRaw','currentLocationRaw','handler','urgent','currentStatus'];
function splitSocarPasteLine(line){
  if(line.includes('\t'))return line.split('\t');
  if(line.includes('|'))return line.split('|');
  return line.split(/\s{2,}/);
}
function splitSocarVehicleCell(raw){
  const text=String(raw||'').trim();
  const plateRe=/\d{2,3}\s?[가-힣]\s?\d{4}/g;
  const atIdx=text.indexOf('@');
  const scope=atIdx>=0?text.slice(0,atIdx):text;
  let m,last=null;
  while((m=plateRe.exec(scope)))last=m;
  const vehicleNo=last?last[0].replace(/\s/g,''):'';
  let carModel=last?scope.slice(last.index+last[0].length):scope;
  carModel=carModel.replace(/\[[^\]]*\]/g,' ').replace(/@/g,' ').replace(/\s+/g,' ').trim();
  return {vehicleNo,carModel};
}
function parseSocarVehicleFromRaw(raw){
  const text=String(raw||'');
  const plateRe=/\d{2,3}\s?[가-힣]\s?\d{4}/g;
  const dateRe=/\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}/g;
  const atIdx=text.indexOf('@');
  const scope=atIdx>=0?text.slice(0,atIdx):text;
  let dm,lastDate=null;
  while((dm=dateRe.exec(scope)))lastDate=dm;
  const afterDate=lastDate?scope.slice(lastDate.index+lastDate[0].length):scope;
  let pm,lastPlate=null;
  while((pm=plateRe.exec(afterDate)))lastPlate=pm;
  let plateHit=lastPlate,base=afterDate;
  if(!plateHit){
    // 날짜 뒤에서 못찾으면 @ 앞 전체에서 마지막 번호판 패턴을 사용
    let pm2,last2=null;
    while((pm2=plateRe.exec(scope)))last2=pm2;
    plateHit=last2;base=scope;
  }
  const vehicleNo=plateHit?plateHit[0].replace(/\s/g,''):'';
  let carModel=plateHit?base.slice(plateHit.index+plateHit[0].length):'';
  carModel=carModel.replace(/\[[^\]]*\]/g,' ').replace(/@/g,' ').replace(/[\r\n]/g,' ').replace(/\s+/g,' ').trim();
  const noTokens=text.split(/[\t\n]/).map(t=>t.trim());
  const no=noTokens.find(t=>/^\d{5,9}$/.test(t))||'';
  const receivedAt=lastDate?lastDate[0]:'';
  let region='';
  if(atIdx>=0){
    const afterAt=text.slice(atIdx+1);
    const bracketIdx=afterAt.indexOf('[');
    region=(bracketIdx>=0?afterAt.slice(0,bracketIdx):afterAt).replace(/[\t\r\n]+/g,' ').replace(/\s+/g,' ').trim();
  }
  let faultType='',faultCat1='',faultCat2='';
  const lines=text.replace(/\r/g,'').split('\n').map(l=>l.trim()).filter(Boolean);
  const rowLine=lines.find(l=>l.includes('\t')||l.includes('|'));
  if(rowLine){
    const cells=splitSocarPasteLine(rowLine).map(c=>c.trim());
    if(cells.length>=6){faultType=cells[3]||'';faultCat1=cells[4]||'';faultCat2=cells[5]||'';}
  }
  return {vehicleNo,carModel,no,receivedAt,region,faultType,faultCat1,faultCat2};
}
function inferSocarWorkTypeFromFault(faultCat2){
  const t=String(faultCat2||'');
  if(/썬팅/.test(t))return '전면유리재썬팅';
  if(/유리[_\s]?파손/.test(t))return '전면유리교체';
  return '';
}
function parseSocarCaseTable(raw){
  const lines=String(raw||'').replace(/\r/g,'').split('\n');
  const rowLines=[];
  for(const line of lines){
    const trimmed=line.trim();
    if(!trimmed)continue;
    const firstCell=(line.split('\t')[0]||'').trim();
    if(/^\d+$/.test(firstCell)){
      rowLines.push(line);
    }else if(rowLines.length){
      rowLines[rowLines.length-1]+=' '+trimmed;
    }
  }
  const rows=[];
  for(const line of rowLines){
    const cells=splitSocarPasteLine(line).map(c=>c.trim());
    if(cells.length<8)continue;
    const rec={};
    SOCAR_CASE_COLUMNS.forEach((key,i)=>{rec[key]=cells[i]||''});
    const {vehicleNo,carModel}=splitSocarVehicleCell(rec.vehicleRaw);
    rec.vehicleNo=vehicleNo;rec.carModel=carModel;
    rec.currentLocationKm=(rec.currentLocationRaw||'').replace(/[^0-9.]/g,'');
    rec.handlerAssigned=/핸들러멤버/.test(rec.statusRaw||'');
    rows.push(rec);
  }
  return rows;
}
function ingestSocarCasePaste(){
  const el=$('#socarCaseRaw');

  if(!rows.length){toast('표 형식을 인식하지 못했습니다. 쏘카 전산에서 표를 그대로 복사해 붙여넣어 주세요');return}
  createAutoBackup('쏘카 접수 붙여넣기 전');
  state.socarCases=state.socarCases||[];
  let added=0,updated=0;
  rows.forEach(rec=>{

    if(!c){
      c={id:'soc'+Date.now()+Math.random().toString(36).slice(2,6),no:rec.no,
        socarZoneId:'',scheduleRaw:'',scheduleRows:[],scheduleStatus:'미확인',
        serviceMode:'',vin:'',partNo:'',partName:'',listPrice:0,partLookupRaw:'',
        contractPrice:0,assignedShop:'',etaMin:'',etaKm:'',assignedCost:0,
        deadline:'',dropoffDate:'',workType:'',photosAttached:false,
        stage:0,driverConfirmed:false,dropoffConfirmed:false,pickupRequested:false,returnConfirmed:false};
      state.socarCases.unshift(c);added++;
    }else updated++;
    Object.assign(c,{
      statusRaw:rec.statusRaw,endTime:rec.endTime,faultType:rec.faultType,faultCat1:rec.faultCat1,
      faultCat2:rec.faultCat2,receivedAt:rec.receivedAt,completedAt:rec.completedAt,
      vehicleNo:rec.vehicleNo,carModel:rec.carModel,vehicleRaw:rec.vehicleRaw,region:rec.region,
      socarZoneRaw:rec.socarZoneRaw,currentLocationRaw:rec.currentLocationRaw,currentLocationKm:rec.currentLocationKm,
      handler:rec.handler,urgent:rec.urgent,currentStatus:rec.currentStatus,handlerAssigned:rec.handlerAssigned
    });
    if(!c.workType && rec.faultType==='차량문제')c.workType=inferSocarWorkTypeFromFault(rec.faultCat2||rec.faultCat1);
    if(socarIsTintWork(c.workType))c.serviceMode='입고';
  });
  save();
  if(el)el.value='';
  renderSocar();
  toast(`접수 ${added}건 추가, ${updated}건 갱신했습니다`);
}

function parseSocarSchedule(raw){
  const lines=String(raw||'').replace(/\r/g,'').split('\n').map(l=>l.trim()).filter(Boolean);
  const rows=[];
  for(const line of lines){
    if(/^다음\s*예약/.test(line))continue;
    if(/^회원명/.test(line))continue;
    const cells=splitSocarPasteLine(line).map(c=>c.trim()).filter(x=>x!=='');
    if(cells.length<4)continue;
    const [member,rideType,startAt,endAt,status]=cells;
    rows.push({member:member||'',rideType:rideType||'',startAt:startAt||'',endAt:endAt||'',status:status||''});
  }
  return rows;
}
function computeSocarScheduleStatus(rows){
  if(!rows||!rows.length)return '미확인';
  const hasRealMemberDriving=rows.some(r=>r.status==='운행중' && !/블락/.test(r.member) && r.member.trim());
  if(hasRealMemberDriving)return '운행중';
  const hasAccidentBlock=rows.some(r=>/사고블락/.test(r.member));
  if(hasAccidentBlock)return '사고확인필요';
  const hasWorkBlock=rows.some(r=>/장애블락|점검블락/.test(r.member));
  if(hasWorkBlock)return '점검가능';
  return '미확인';
}
function socarNextAvailableFromRows(rows){
  const driving=(rows||[]).find(r=>r.status==='운행중' && !/블락/.test(r.member) && r.member.trim());
  return driving?driving.endAt:'';
}

async function saveSocarCompletionPhotosToSharedFolder(id){
  const c=getSocarCase(id);if(!c)return;
  const companyId='socar', company=companyById(companyId);
  const input=$('#socarCompletePhotos_'+id);
  const files=[...(input?.files||[])];
  if(!files.length){toast('먼저 가맹점·협력점에서 받은 완료사진을 선택해 주세요');return}
  let h=sharedRootHandles[companyId]||await loadSharedHandle(companyId);
  if(!h){
    alert(`쏘카 공유폴더가 연결되어 있지 않습니다.\n\n왼쪽 메뉴 ⚙️ 기준정보 관리 > 📁 회사별 공유폴더 연결에서 쏘카 폴더를 먼저 연결해 주세요.`);
    return;
  }
  const ok=await ensureSharedPermission(h,true);
  if(!ok){alert('쏘카 공유폴더 쓰기 권한이 필요합니다. 다시 폴더 연결을 눌러 권한을 허용해 주세요.');return}
  const name=socarDefaultFolderName(c);
  try{
    const dir=await h.getDirectoryHandle(name,{create:true});
    const saved=[];
    for(const file of files){
      const fh=await dir.getFileHandle(file.name,{create:true});
      const w=await fh.createWritable();
      await w.write(file);
      await w.close();
      saved.push(file.name);
    }
    c.completionPhotosCount=files.length;
    c.sharedFolderSaved=true;
    c.sharedFolderSavedAt=new Date().toISOString();
    c.sharedFolderRootName=h.name;
    c.savedPhotoNames=saved;
    save();renderSocar();
    toast(`쏘카 / ${name} 폴더에 사진 ${files.length}장 실제 저장 완료`);
  }catch(e){
    console.error(e);
    alert(`쏘카 공유폴더 사진 저장 중 오류가 발생했습니다.\n`+(e?.message||e));
  }
}

function socarCaseBadges(c){
  const badges=[];
  if(c.currentStatus)badges.push(`<span class="badge ${c.currentStatus==='처리중'?'orange':'blue'}">${esc(c.currentStatus)}</span>`);
  const schedMap={'운행중':'orange','사고확인필요':'orange','점검가능':'green','미확인':'blue'};
  if(c.scheduleStatus && c.scheduleStatus!=='미확인')badges.push(`<span class="badge ${schedMap[c.scheduleStatus]||'blue'}">${esc(c.scheduleStatus)}</span>`);

const FS_DB_NAME='sk_rentcar_fs';
const FS_STORE='handles';
let sharedRootHandles={};
const COMPANY_FOLDER_HINTS={
  sk:'SK렌터카 장애처리 사진(2026년)',
  socar:'쏘카 장애처리 사진(2026년)',
  car123:'카123 장애처리 사진(2026년)',
  peoplecar:'피플카(트루카) 장애처리 사진(2026년)',
  harmony:'하모니렌터카 장애처리 사진(2026년)'
};

function fsDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(FS_DB_NAME,1);
    req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(FS_STORE))req.result.createObjectStore(FS_STORE)};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error);
  });
}
function sharedHandleKey(companyId){return `photoRoot_${companyId||'sk'}`}
async function saveSharedHandle(companyId,handle){
  try{
    const db=await fsDB();
    await new Promise((res,rej)=>{
      const tx=db.transaction(FS_STORE,'readwrite');
      tx.objectStore(FS_STORE).put(handle,sharedHandleKey(companyId));
      tx.oncomplete=res;tx.onerror=()=>rej(tx.error);
    });
    db.close();sharedRootHandles[companyId]=handle;
  }catch(e){console.warn('공유폴더 핸들 저장 실패',e)}
}
async function loadSharedHandle(companyId){
  try{
    const db=await fsDB();
    let h=await new Promise((res,rej)=>{
      const tx=db.transaction(FS_STORE,'readonly');
      const r=tx.objectStore(FS_STORE).get(sharedHandleKey(companyId));
      r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error);
    });
    // V26 이전의 단일 공유폴더 연결은 SK렌터카 연결로 자동 승계
    if(!h && companyId==='sk'){
      h=await new Promise((res,rej)=>{
        const tx=db.transaction(FS_STORE,'readonly');
        const r=tx.objectStore(FS_STORE).get('photoRoot');
        r.onsuccess=()=>res(r.result||null);r.onerror=()=>rej(r.error);
      });
    }
    db.close();
    if(h){sharedRootHandles[companyId]=h;if(companyId==='sk')await saveSharedHandle('sk',h)}
    return h;
  }catch(e){return null}
}
async function loadAllSharedHandles(){
  for(const cp of BASE_COMPANIES)await loadSharedHandle(cp.id);
  return sharedRootHandles;
}
async function clearSharedHandle(companyId){
  try{
    const db=await fsDB();
    await new Promise((res,rej)=>{
      const tx=db.transaction(FS_STORE,'readwrite');
      tx.objectStore(FS_STORE).delete(sharedHandleKey(companyId));
      tx.oncomplete=res;tx.onerror=()=>rej(tx.error);
    });
    db.close();
  }catch(e){}
  delete sharedRootHandles[companyId];
  try{renderSettings()}catch(e){}
  toast(`${companyById(companyId).name} 공유폴더 연결을 해제했습니다`);
}
async function ensureSharedPermission(handle,ask=false){
  if(!handle)return false;
  try{
    const opts={mode:'readwrite'};
    if((await handle.queryPermission(opts))==='granted')return true;
    if(ask && (await handle.requestPermission(opts))==='granted')return true;
  }catch(e){console.warn(e)}
  return false;
}
async function connectSharedFolder(companyId){
  const company=companyById(companyId);
  if(!('showDirectoryPicker' in window)){
    alert('이 브라우저에서는 폴더 직접 저장 기능을 지원하지 않습니다. Chrome / Edge / Whale 최신 버전에서 GitHub Pages(https)로 사이트를 열어주세요.');
    return;
  }
  try{
    const handle=await window.showDirectoryPicker({mode:'readwrite'});
    const ok=await ensureSharedPermission(handle,true);
    if(!ok){toast('폴더 쓰기 권한이 허용되지 않았습니다');return}
    await saveSharedHandle(companyId,handle);
    try{renderSettings()}catch(e){}
    toast(`${company.name} 공유폴더 연결 완료: ${handle.name}`);
  }catch(e){
    if(e?.name!=='AbortError')alert('공유폴더 연결 중 오류가 발생했습니다: '+(e?.message||e));
  }
}

async function saveCompletionPhotosToSharedFolder(id){
  const c=getCase(id);if(!c)return;
  const companyId=c.companyId||'sk', company=companyById(companyId);
  const input=$('#completePhotos');
  const files=[...(input?.files||[])];
  if(!files.length){toast('먼저 가맹점에서 받은 완료사진을 선택해 주세요');return}
  let h=sharedRootHandles[companyId]||await loadSharedHandle(companyId);
  if(!h){
    alert(`${company.name} 공유폴더가 연결되어 있지 않습니다.\n\n이 작업은 ${company.name} 건이므로 ${company.name} 전용 공유폴더를 먼저 연결해 주세요.`);
    return;
  }
  const ok=await ensureSharedPermission(h,true);
  if(!ok){
    alert(`${company.name} 공유폴더 쓰기 권한이 필요합니다. 다시 폴더 연결을 눌러 권한을 허용해 주세요.`);
    return;
  }
  const name=(($('#completionFolderName')?.value)||folderName(c)).trim();
  if(!name){toast('생성 폴더명을 확인해 주세요');return}
  try{
    const dir=await h.getDirectoryHandle(name,{create:true});
    const saved=[];
    for(const file of files){
      const fh=await dir.getFileHandle(file.name,{create:true});
      const w=await fh.createWritable();
      await w.write(file);
      await w.close();
      saved.push(file.name);
    }
    c.customFolderName=name;
    c.completionPhotosCount=files.length;
    c.sharedFolderSaved=true;
    c.sharedFolderCompanyId=companyId;
    c.sharedFolderSavedAt=new Date().toISOString();
    c.sharedFolderRootName=h.name;
    c.savedPhotoNames=saved;
    save();
    openCompletion(id);
    toast(`${company.name} / ${name} 폴더에 사진 ${files.length}장 실제 저장 완료`);
  }catch(e){
    console.error(e);
    alert(`${company.name} 공유폴더 사진 저장 중 오류가 발생했습니다.\n`+(e?.message||e));
  }
}

function createAutoBackup(reason='자동백업'){
  try{
    const list=LS.get('sk_auto_backups',[]);
    const b={id:'ab'+Date.now(),createdAt:new Date().toISOString(),reason,data:backupPayload()};

function downloadBackup(){
  const data=backupPayload(), now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  const stamp=`${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}`;
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`SK렌터카_업무백업_${stamp}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('백업 파일을 만들었습니다');
}
function validateBackupData(d){
  return d&&typeof d==='object'&&Array.isArray(d.cases)&&Array.isArray(d.rates)&&Array.isArray(d.centers)&&Array.isArray(d.workTypes);
}
function selectRestoreFile(input){

}
function renderRestorePreview(){
  const el=$('#restorePreview');if(!el||!pendingRestoreData)return;const d=pendingRestoreData;
  el.innerHTML=`<div class="restore-preview"><b>복원할 백업 확인</b><div class="small muted" style="margin-top:4px">백업일시: ${esc(formatDateTime(d.exportedAt))} · 버전: ${esc(d.version||'-')}</div><div class="restore-stats"><div class="restore-stat"><b>${(d.cases||[]).length}</b><span class="tiny muted">최근 작업</span></div><div class="restore-stat"><b>${(d.rates||[]).length}</b><span class="tiny muted">단가 데이터</span></div><div class="restore-stat"><b>${(d.centers||[]).length}</b><span class="tiny muted">센터</span></div><div class="restore-stat"><b>${(d.trash||[]).length}</b><span class="tiny muted">휴지통</span></div></div><div class="notice warn" style="margin-top:10px">복원하면 현재 브라우저의 업무 데이터가 이 백업 시점의 내용으로 바뀝니다. 복원 직전 상태는 자동백업으로 먼저 보관합니다.</div><div class="actions"><button class="btn primary" onclick="applyRestore()">이 백업으로 복원</button><button class="btn" onclick="pendingRestoreData=null;renderBackup()">취소</button></div></div>`;
}
function applyStateFromBackup(d){
  state.centers=(d.centers||BASE_CENTERS).map(base=>({...base}));state.workTypes=[...(d.workTypes||BASE_WORKTYPES)];state.rates=JSON.parse(JSON.stringify(d.rates||BASE_RATE));state.cases=JSON.parse(JSON.stringify(d.cases||[]));state.trash=JSON.parse(JSON.stringify(d.trash||[]));state.affiliates=JSON.parse(JSON.stringify(d.affiliates||[]));state.manager='이현경 매니저';localStorage.setItem('sk_manager',state.manager);$('#managerName').value=state.manager;state.currentCaseId=null;state.newCaseCompanyId=null;state.newCaseCenterId=null;save();purgeExpiredTrash();
}
function applyRestore(){if(!pendingRestoreData)return;if(!confirm('선택한 백업으로 현재 데이터를 복원할까요?'))return;createAutoBackup('파일 복원 직전');const d=pendingRestoreData;pendingRestoreData=null;applyStateFromBackup(d);show('dashboard');toast('백업 데이터로 복원했습니다')}
function restoreAutoBackup(id){const b=LS.get('sk_auto_backups',[]).find(x=>x.id===id);if(!b)return;if(!confirm(`${formatDateTime(b.createdAt)} 자동백업으로 되돌릴까요?`))return;createAutoBackup('자동백업 복원 직전');applyStateFromBackup(b.data);show('dashboard');toast('자동백업으로 복원했습니다')}
function clearAutoBackups(){if(!confirm('자동백업 기록을 모두 삭제할까요? 현재 업무 데이터는 삭제되지 않습니다.'))return;LS.set('sk_auto_backups',[]);renderBackup();toast('자동백업 기록을 비웠습니다')}
function formatDateTime(v){if(!v)return '-';try{return new Date(v).toLocaleString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(e){return v}}
function purgeExpiredTrash(){
  const list=state?.trash||LS.get('sk_trash',[]), now=Date.now(), max=30*24*60*60*1000;const kept=list.filter(x=>!x.deletedAt||(now-new Date(x.deletedAt).getTime())<max);
  if(state)state.trash=kept;LS.set('sk_trash',kept);
}
function restoreTrashCase(id){const idx=(state.trash||[]).findIndex(x=>x.id===id);if(idx<0)return;createAutoBackup('휴지통 복원 전');const c=state.trash.splice(idx,1)[0];delete c.deletedAt;state.cases.unshift(c);save();renderTrash();toast('최근 작업으로 복원했습니다')}
function permanentDeleteTrash(id){const c=(state.trash||[]).find(x=>x.id===id);if(!c)return;if(!confirm(`NO.${c.no} ${c.vehicleNo}을 완전삭제할까요? 이 작업은 되돌릴 수 없습니다.`))return;createAutoBackup('휴지통 완전삭제 전');state.trash=state.trash.filter(x=>x.id!==id);save();renderTrash();toast('완전삭제했습니다')}
function emptyTrash(){if(!(state.trash||[]).length)return;if(!confirm('휴지통의 모든 작업을 완전삭제할까요?'))return;createAutoBackup('휴지통 비우기 전');state.trash=[];save();renderTrash();toast('휴지통을 비웠습니다')}
function renderBackup(){
  const autos=LS.get('sk_auto_backups',[]);
  $('#backup').innerHTML=`<div class="backup-grid"><div class="card"><h2>💾 수동 백업 · 복원</h2><div class="notice blue">업무 데이터, 최근 작업, 진행상태, 담당자, 센터·가맹점 설정, 차종·부품·단가, 시공내용, 휴지통을 JSON 파일 하나로 백업합니다.</div><div class="actions"><button class="btn primary" onclick="downloadBackup()">💾 지금 백업파일 만들기</button><label class="btn soft file-btn">♻️ 백업파일 선택<input type="file" accept=".json,application/json" style="display:none" onchange="selectRestoreFile(this)"></label></div><div class="notice warn" style="margin-top:12px"><b>사진 파일 자체는 백업파일에 포함되지 않습니다.</b><br>JSON 백업에는 사진 파일 자체가 들어가지 않습니다. 완료사진은 연결한 회사 공유폴더에 실제 파일로 저장됩니다.</div><div id="restorePreview"></div></div><div class="card"><div class="toolbar"><div><h2>자동백업</h2><div class="small muted">중요한 수정·삭제·완료 처리 직전 상태를 최근 10개까지 보관합니다.</div></div>${autos.length?'<button class="btn danger" onclick="clearAutoBackups()">기록 비우기</button>':''}</div>${autos.length?`<div class="backup-list">${autos.map(b=>`<div class="backup-item"><div class="meta"><b>${esc(b.reason||'자동백업')}</b><span>${esc(formatDateTime(b.createdAt))} · 작업 ${(b.data?.cases||[]).length}건 · 단가 ${(b.data?.rates||[]).length}건</span></div><button class="btn soft" onclick="restoreAutoBackup('${b.id}')">이 상태로 복원</button></div>`).join('')}</div>`:'<div class="empty">아직 자동백업이 없습니다.<br>작업 삭제, 단가 수정, 작업완료 등의 중요한 변경 직전에 자동으로 생성됩니다.</div>'}</div></div>`;
  if(pendingRestoreData)renderRestorePreview();
}
function renderTrash(){purgeExpiredTrash();const rows=(state.trash||[]).slice().sort((a,b)=>String(b.deletedAt||'').localeCompare(String(a.deletedAt||'')));$('#trash').innerHTML=`<div class="card"><div class="toolbar"><div><h2>🗑️ 휴지통</h2><div class="small muted">최근 작업에서 삭제한 업무를 30일간 보관합니다. 필요한 건은 복원할 수 있습니다.</div></div>${rows.length?'<button class="btn danger" onclick="emptyTrash()">휴지통 비우기</button>':''}</div>${rows.length?`<div class="table-wrap"><table><thead><tr><th>NO.</th><th>삭제일</th><th>센터</th><th>차량번호</th><th>차종</th><th>시공점</th><th>삭제 전 상태</th><th></th></tr></thead><tbody>${rows.map(c=>`<tr class="trash-row"><td>${c.no}</td><td>${esc(formatDateTime(c.deletedAt))}</td><td>${esc(c.center)}</td><td><b>${esc(c.vehicleNo)}</b></td><td>${esc(c.carModel)}</td><td>${esc(c.shop)}</td><td>${esc(c.status)}</td><td><div class="recent-actions"><button class="btn soft" onclick="restoreTrashCase('${c.id}')">복원</button><button class="btn danger" onclick="permanentDeleteTrash('${c.id}')">완전삭제</button></div></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">휴지통이 비어 있습니다.</div>'}</div>`}

const DEFAULT_TOP_TITLE=`장애처리 업무 <span class="badge blue" style="margin-left:8px">V33</span>`;
function setTopTitle(html){const b=$('#topTitleBox');if(b)b.innerHTML=html}
function topTitleCompanyHTML(name,label,buttonsHTML){
  return `<span>${esc(name)} ${esc(label)}</span>${buttonsHTML}`;
}
function render(view){
  setTopTitle(DEFAULT_TOP_TITLE);
  const ncDateBox=$('#ncDateBox'); if(ncDateBox)ncDateBox.style.display='none';
  const fn=({dashboard:renderDashboard,newcase:renderNewCase,socar:renderSocar,activecases:renderActive,completion:renderCompletion,completedcases:renderCompletedCases,recent:renderRecent,history:renderHistory,affiliates:renderAffiliates,ratecheck:renderRateCheck,master:renderMaster,backup:renderBackup,trash:renderTrash,settings:renderSettings}[view]||renderDashboard);
  try{fn();}catch(err){
    console.error('화면 렌더링 오류',view,err);
    const target=document.getElementById(view)||document.getElementById('dashboard');
    if(target)target.innerHTML=`<div class="card"><h2>화면 표시 오류</h2><div class="notice warn">화면을 표시하는 중 오류가 발생했습니다. 새로고침 후 다시 시도해 주세요.<br><span class="small muted">${esc(err?.message||String(err))}</span></div><div class="actions"><button class="btn primary" onclick="show('dashboard')">업무현황으로</button><button class="btn soft" onclick="show('activecases')">처리중 다시 열기</button></div></div>`;
  }
}
loadAllSharedHandles().then(()=>{try{if(document.querySelector('#settings.view.active'))renderSettings()}catch(e){}});
renderDashboard();
</script>
</body>
</html>
